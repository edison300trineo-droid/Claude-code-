[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpcr-biod"
version = "0.2.0"
description = "Alu qPCR biodistribution consolidation pipeline (BD-TS series)"
requires-python = ">=3.10"
dependencies = [
    # numpy 不再直接使用（標準曲線改為純 Python 回歸）；
    # 它目前仍會隨 pandas 一併安裝。
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
qpcr-biod = "qpcr_biod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
