# ---------------------------------------------------------------------------
# 研究設定檔 — BD-TS-20260701 ELIXCYTE Alu qPCR 生物分布
#
# 這個檔案是「規則」的唯一來源。要改允收標準、LOB 倍數、臟器代碼，改這裡，
# 不要改程式碼，也不要手改產出的統整表。
# ---------------------------------------------------------------------------

study_id: BD-TS-20260701
study_title: ELIXCYTE qPCR (Alu 序列) 生物分布數據統整表
unit: "pg human DNA / 10 ng gDNA"

paths:
  # 資料放 NAS（同仁看得到），程式留在本機（C:\qpcr-biod）。
  #
  # ⚠ UNC 路徑一定要用「單引號」。YAML 的雙引號字串會把反斜線當跳脫字元，
  #   寫成 "\\10.2.18.80\..." 會直接解析失敗。單引號內反斜線是字面值。
  #
  # 改回本機測試時，把下面四行換成相對路徑即可：
  #   raw_dir: "../data/raw"   （相對路徑以本設定檔所在資料夾為基準）
  raw_dir:        '\\10.2.18.80\05 ts\PT臨床前試驗中心\Edison Test\data\raw'
  reference_dir:  '\\10.2.18.80\05 ts\PT臨床前試驗中心\Edison Test\data\reference'
  decisions_file: '\\10.2.18.80\05 ts\PT臨床前試驗中心\Edison Test\data\decisions.xlsx'
  output_dir:     '\\10.2.18.80\05 ts\PT臨床前試驗中心\Edison Test\output'

# --- 標準曲線允收標準 (SHGLP-SOP-GE-001-F02 Rev.01) --------------------------
standard_curve:
  # 標準品名稱格式，第一點濃度最高
  name_pattern: "^STD(?P<index>\\d{2})$"
  # 各標準點的標稱濃度 (pg)。STD01 為最高點，最後一點視為 LLOQ。
  # STD01 起一路 5 倍序列稀釋至 STD08（10000 / 5^7 = 0.128）。
  nominal_concentrations:
    STD01: 10000
    STD02: 2000
    STD03: 400
    STD04: 80
    STD05: 16
    STD06: 3.2
    STD07: 0.64
    STD08: 0.128
  # 設定檔標稱濃度與儀器實際輸出的相對容差。儀器以 float32 儲存，
  # 3.2 會寫成 3.200000048，所以不能用完全相等比較。
  # 超出此容差代表設定檔的稀釋序列填錯了，會在執行時提出警告。
  nominal_tolerance: 0.001
  lloq_point: STD08          # 該 run 的 LLOQ 取這一點的濃度
  # 回歸基準：
  #   point_mean = 每個標準點取 Ct 平均後回歸（n = 標準點數，與既有統整表一致）
  #   well       = 直接用所有標準品孔位回歸（n = 孔位數）
  # 平衡設計下兩者斜率/截距相同，但 well 會把孔間變異算進殘差，R² 較低。
  # R² 是允收標準，所以這個選項會影響判定結果。
  fit_basis: point_mean
  min_r_squared: 0.98
  efficiency_range: [85.0, 115.0]   # PCR 效率 (%)

# --- QC 允收標準 -----------------------------------------------------------
qc:
  # 回收率判定「只」以敏感度對照組為準 (依 EC 指示)
  sensitivity_control:
    # 由樣品名稱解析標稱濃度，例如 "200pg sensitivity control"
    name_pattern: "(?P<conc>\\d+(?:\\.\\d+)?)\\s*pg"
    recovery_range: [80.0, 120.0]
  # 已知濃度回推 QC (STD07/STD08 以 UNKNOWN task 重跑) — 保留原始資料，不納入判定
  std_accuracy_check:
    include_in_qc_sheet: false
  # 臟器基質 QC 對照組，例如 "27 mouse blood cell pellet DNA"
  matrix_control:
    name_pattern: "^(?P<organ_code>\\d{2})\\s+mouse\\s+.*DNA$"
  # NTC：Alu 為高敏感度方法，微量背景屬正常；只有回推濃度 >= 該 run LLOQ 才判異常
  ntc:
    names: ["NTC"]
    abnormal_if_quantity_gte_lloq: true

# --- 檢體命名規則 ----------------------------------------------------------
sample:
  # 動物檢體：<動物編號>_<臟器代碼>，例如 1006_99
  animal_pattern: "^(?P<animal>\\d{4})[_-](?P<organ_code>\\d{2})(?P<suffix>.*)$"
  # 判定為 rerun 的名稱後綴 (不分大小寫)。留空則只靠「同一 key 出現在較晚的 run」判定。
  rerun_suffixes: ["_re", "_rerun", "-re", "-r", " re", "_2", "-2"]
  # 同一 動物_臟器 出現在多個 run 時，以 Run 結束時間較晚者為 rerun 並預設為最終採用。
  later_run_is_rerun: true

# --- ND / HIGHSD 判定規則 --------------------------------------------------
reporting:
  nd_label: "ND"
  # Quantity Mean < 該 run LLOQ 即標示 ND；原始測得值不覆蓋，另存一欄
  nd_below_lloq: true
  highsd:
    # 最終採用列仍為 HIGHSD=Y 且無 rerun 時的處理
    quantifiable_action: "manual_review"   # 需人工複核 (淺紅底)
    nd_action: "expected"                  # ND 時視為預期現象 (淺綠底)

# --- 血液 (27) LOB 校正 ----------------------------------------------------
lob:
  enabled: true
  organ_code: "27"
  # 主要依據：Predose 動物血液「孔位層級」數值
  source: predose_wells
  baseline_timepoint: "Predose"
  primary_multiplier: 1.645     # LOB = Mean + k*SD，本次分析採用值
  reference_multiplier: 2.0     # 僅供參考比較
  min_n: 20                     # 低於此筆數會在報表加註提醒
  # 判為陽性需同時通過：非 ND 且 >= LOB
  positive_requires_non_nd: true
  # Predose 本身為 LOB 定義組，濃度/陽性隻數欄位標示為 "-"
  exclude_baseline_from_stats: true

# --- Mean±SD 彙整報表 ------------------------------------------------------
summary:
  # 只納入可定量 (非 ND) 數值；ND 檢體數記於 Remarks，不以任何值代入估算
  include_nd_in_stats: false
  report_cv: false
  timepoint_order:
    - Predose
    - 1h
    - Day 2
    - Day 8
    - Day 15
    - Day 22
    - Day 29
    - Day 43
    - Day 57
    - Day 70
  # 交付子集：需要只針對部分臟器另出一張 Mean±SD 表時填在這裡，
  # 每一個項目會產生一張以該名稱命名的分頁。留空(或整段刪除)則不產生。
  # 範例：
  #   delivery_subsets:
  #     "8-31 交付":
  #       organ_codes: ["03", "22", "23", "64", "99"]
  #       note: "血液(27)需另行套用 LOB 校正後判讀，不含於本子集"
  delivery_subsets: {}

# --- 繪圖用資料 ------------------------------------------------------------
dot_plot:
  organ_codes: ["99"]
  # ND 於繪圖時代入的值 (僅供繪圖，不影響統計)
  nd_plot_substitute: "lloq/2"

# --- 組別判定 (依計畫書 Table.1) -------------------------------------------
groups:
  # 時間點 -> 組別。同一時間點對應多組時判定為「待確認」，需由決策表指定。
  "Group 1 (Control)": ["Day 29"]
  "Group 2 (Test Item)":
    - Predose
    - 1h
    - Day 2
    - Day 8
    - Day 15
    - Day 22
    - Day 29
    - Day 43
    - Day 57
    - Day 70
  ambiguous_label: "待確認"

# --- 臟器代碼對照表 ---------------------------------------------------------
# 同樣是備援：有官方對照表時以那份為準。來源優先序為
# 人工決策表 > 官方上機編號對照表 > 本設定檔。
organ_codes:
  "01": {en: "Adrenal gland", zh: "腎上腺"}
  "03": {en: "Bone marrow",   zh: "骨髓pellet"}
  "04": {en: "Brain",         zh: "腦"}
  "11": {en: "Ovaries",       zh: "卵巢"}
  "19": {en: "Liver",         zh: "肝"}
  "21": {en: "Heart",         zh: "心"}
  "22": {en: "Spleen",        zh: "脾"}
  "23": {en: "Lung",          zh: "肺"}
  "24": {en: "Kidney",        zh: "腎"}
  "25": {en: "Testis",        zh: "睪丸"}
  "27": {en: "Blood",         zh: "血液pellet"}
  "61": {en: "Cervical",      zh: "頸椎"}
  "62": {en: "Lumber",        zh: "腰椎"}
  "63": {en: "Thoracic",      zh: "胸椎"}
  "64": {en: "Lymph node",    zh: "淋巴結"}
  "99": {en: "Injection site", zh: "注射處關節"}

# --- 時間點寫法正規化 ------------------------------------------------------
# 官方對照表寫 "Pre-dose" / "Day 02" / "1 hour"，統整表用 "Predose" / "Day 2" / "1h"。
# 不統一的話同一個時間點會被當成兩個，Mean/SD 會被拆散。
# 除了下列對照，還會自動把 "Day 02" 這類前導零去掉（Day 0N -> Day N）。
timepoint_aliases:
  "Pre-dose": "Predose"
  "Predose": "Predose"
  "Pre dose": "Predose"
  "1 hour": "1h"
  "1hr": "1h"
  "1 hr": "1h"

# --- 動物參考資料 (性別/採樣時間點) ---------------------------------------
# 性別與時間點「只」從參考檔取得，不由動物編號前綴推測。
# 找不到對應資料時欄位留白並在執行摘要提示，不猜。
reference:
  # 官方「上機編號_說明」對照表由專門的解析器處理（見 official_table.py）——
  # 那份檔案的性別是靠「動物編號寫在 M 欄還是 F 欄」表示的，欄名比對抓不到。
  # 以下別名是給其他一般表格式參考檔（例如 Tissue Weight 紀錄）用的。
  # 欄名對照：左邊是內部欄位，右邊是參考檔可能出現的欄名（依序比對，不分大小寫）
  column_aliases:
    animal_id: ["動物編號", "Animal No", "Animal No.", "Animal ID", "Animal Number", "No"]
    sex: ["性別", "Sex", "Gender"]
    timepoint: ["採樣時間點", "Time point", "Timepoint", "Sampling time", "Necropsy"]
    organ_code: ["臟器代碼", "Organ code", "Tissue code"]
  # 多個參考檔對同一動物給出不同性別/時間點時的處理：
  #   conflict = 標記衝突並留白（預設，需人工確認）
  #   first    = 採用第一個來源
  on_conflict: conflict

# --- 臟器批次與上機編號 (Run) ------------------------------------------------
# 這裡是「備援」：參考資料夾若有官方「上機編號_說明」對照表，批次組成與 Run 排程
# 一律以那份檔案為準，本區塊會被忽略（產出表會註明來源）。只有在官方檔缺席時才用。
# 同一批次的 3 個臟器代碼於同一個 Run 內一起上機，每個 Run 對應 1 個原始 qPCR 檔。
batches:
  "99+03+64": ["99", "03", "64"]
  "27+23+22": ["27", "23", "22"]
  "19+24+21": ["19", "24", "21"]
  "04+25+01": ["04", "25", "01"]
  "61+62+63": ["61", "62", "63"]

run_schedule:
  # 官方對照表僅預先填寫這 6 組 Run 編號；其餘由實際匯入資料逆推，
  # 產出表會在「批次/時間點資料來源」欄註明兩者的差別。
  official:
    - {run: 1, batch: "99+03+64", timepoint: "Predose"}
    - {run: 2, batch: "99+03+64", timepoint: "Day 2"}
    - {run: 3, batch: "99+03+64", timepoint: "Day 8"}
    - {run: 4, batch: "27+23+22", timepoint: "Predose"}
    - {run: 5, batch: "27+23+22", timepoint: "Day 2"}
    - {run: 6, batch: "27+23+22", timepoint: "Day 8"}
  # Run 編號與原始檔案的對應：原始檔內沒有 Run 編號欄位，
  # 因此依 Run 結束時間排序推定。這是推定值，產出表會註明。
  assign_by: run_end_time
